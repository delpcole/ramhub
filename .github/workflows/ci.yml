name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # No Atlas access from CI. Settings need a URI to load, but the Phase 0
      # tests never open a connection. Add a service container here when the
      # first tests that touch the database land in Phase 1.
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_NAME: ramhub_ci
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Test
        run: pytest
